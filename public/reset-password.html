<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Reset Password - Nerovai</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",sans-serif;background:#000;color:#f5f5f7;min-height:100vh;display:flex;align-items:center;justify-content:center;-webkit-font-smoothing:antialiased;overflow:hidden}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse at 20% 50%,rgba(41,151,255,0.12) 0%,transparent 60%),radial-gradient(ellipse at 80% 20%,rgba(191,90,242,0.08) 0%,transparent 60%);pointer-events:none}
.card{position:relative;z-index:1;width:100%;max-width:400px;background:rgba(20,20,20,0.85);backdrop-filter:blur(40px);-webkit-backdrop-filter:blur(40px);border:1px solid rgba(255,255,255,0.08);border-radius:18px;padding:40px 36px;margin:24px}
.logo{text-align:center;font-size:28px;font-weight:700;color:#2997ff;margin-bottom:8px;letter-spacing:-0.5px}
.sub{text-align:center;font-size:14px;color:#a1a1a6;margin-bottom:32px;line-height:1.5}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
label{font-size:13px;color:#a1a1a6;font-weight:500}
input{background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.08);border-radius:10px;padding:13px 16px;color:#f5f5f7;font-size:15px;font-family:inherit;outline:none;transition:border-color 0.2s ease}
input:focus{border-color:#2997ff}
input::placeholder{color:#6e6e73}
.btn{background:#2997ff;color:#fff;border:none;border-radius:980px;padding:13px 24px;font-size:15px;font-weight:600;font-family:inherit;cursor:pointer;transition:all 0.2s ease;width:100%;margin-top:4px}
.btn:hover{opacity:.88}
.btn:disabled{opacity:.5;cursor:not-allowed}
.error{color:#ff453a;font-size:13px;text-align:center;margin-bottom:12px;display:none}
.success-state{text-align:center;display:none}
.success-state svg{margin:0 auto 16px;display:block}
.success-state h3{font-size:20px;font-weight:600;margin-bottom:8px}
.success-state p{font-size:14px;color:#a1a1a6;margin-bottom:24px;line-height:1.5}
.link{color:#2997ff;text-decoration:none;font-size:14px}
.link:hover{opacity:.8}
.form-state{}
.req-badge{display:inline-block;background:rgba(255,214,10,0.1);color:#ffd60a;font-size:11px;padding:2px 8px;border-radius:4px;margin-bottom:20px;text-align:center;width:100%}
</style>
</head>
<body>
<div class="card">
  <div class="logo">Nerovai</div>

  <!-- Invalid token state (shown when token missing) -->
  <div id="invalid-state" style="display:none;text-align:center">
    <p style="font-size:14px;color:#a1a1a6;margin-bottom:20px;line-height:1.5">This reset link is invalid or has expired.<br>Please request a new one.</p>
    <a href="/app" class="link">Back to sign in</a>
  </div>

  <!-- Reset form -->
  <div id="form-state" class="form-state">
    <div class="sub">Enter your new password below.</div>
    <div class="error" id="error-msg"></div>
    <form id="reset-form" onsubmit="handleReset(event)">
      <div class="field">
        <label for="pw1">New password</label>
        <input type="password" id="pw1" placeholder="At least 8 characters" required autocomplete="new-password"/>
      </div>
      <div class="field">
        <label for="pw2">Confirm new password</label>
        <input type="password" id="pw2" placeholder="Repeat password" required autocomplete="new-password"/>
      </div>
      <button type="submit" class="btn" id="submit-btn">Set New Password</button>
    </form>
    <div style="text-align:center;margin-top:20px">
      <a href="/app" class="link">Back to sign in</a>
    </div>
  </div>

  <!-- Success state -->
  <div class="success-state" id="success-state">
    <svg width="48" height="48" viewBox="0 0 48 48" fill="none">
      <circle cx="24" cy="24" r="22" stroke="#30d158" stroke-width="2"/>
      <path d="M15 24l7 7 11-14" stroke="#30d158" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <h3>Password updated</h3>
    <p>Your password has been changed successfully. You can now sign in with your new password.</p>
    <a href="/app" class="btn" style="display:inline-block;text-decoration:none;text-align:center">Sign in</a>
  </div>
</div>

<script>
const API_BASE = window.location.hostname === 'localhost' ? '' : 'https://api.nerovai.com';
const params = new URLSearchParams(window.location.search);
const token = params.get('token');

if (!token) {
  document.getElementById('form-state').style.display = 'none';
  document.getElementById('invalid-state').style.display = 'block';
}

async function handleReset(e) {
  e.preventDefault();
  const pw1 = document.getElementById('pw1').value;
  const pw2 = document.getElementById('pw2').value;
  const errEl = document.getElementById('error-msg');
  const btn = document.getElementById('submit-btn');

  errEl.style.display = 'none';

  if (pw1 !== pw2) {
    errEl.textContent = 'Passwords do not match';
    errEl.style.display = 'block';
    return;
  }
  if (pw1.length < 8) {
    errEl.textContent = 'Password must be at least 8 characters';
    errEl.style.display = 'block';
    return;
  }

  btn.disabled = true;
  btn.textContent = 'Updating...';

  try {
    const res = await fetch(API_BASE + '/api/auth/reset-password', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token, password: pw1 }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Failed to reset password');
    document.getElementById('form-state').style.display = 'none';
    document.getElementById('success-state').style.display = 'block';
  } catch (err) {
    errEl.textContent = err.message;
    errEl.style.display = 'block';
    btn.disabled = false;
    btn.textContent = 'Set New Password';
  }
}
</script>
</body>
</html>
